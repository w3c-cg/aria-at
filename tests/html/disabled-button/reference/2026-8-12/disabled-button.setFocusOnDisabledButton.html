<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Disabled HTML Button Element</title>

<!-- Generated by process-test-directory.js -->
<script>
  (function() {
    function setupScript(testPageDocument) {
      // setFocusOnDisabledButton
      // sets focus on the disabled button
      testPageDocument.querySelector('#action-disabled').focus();

    };
    document.addEventListener('click', function(event) {
      if (event.target.classList.contains('button-run-test-setup')) {
        event.target.disabled = true;
        setupScript(document);
      }
    });
  })();
</script>
<!-- End of generated output --></head>
<body>
  <main>
    <h1>Disabled HTML Button Element</h1>

    <p>
      The following example demonstrates an HTML
      <a href="https://www.w3.org/TR/html-aam-1.0/disabled-button.html"><code>&lt;button&gt;</code> element</a>
      with the <code>disabled</code> attribute.
    </p>

    <section>
      <div class="example-header">
        <h2 id="ex_disabled_label">Example: Disabled</h2>
      </div>

      <div role="separator" id="ex_disabled_start_sep" aria-labelledby="ex_disabled_start_sep ex_disabled_label" aria-label="Start of"></div>

      <div id="example-disabled">
        <p>This <q>Print</q> action represents a disabled HTML <code>button</code> element.</p>
        <a id="beforelink" href="#beforelink">Navigate forwards from here</a>
        <button id="action-disabled" disabled tabindex="-1">Print Page</button>
        <a id="afterlink" href="#afterlink">Navigate backwards from here</a>
      </div>

      <div role="separator" id="ex_disabled_end_sep" aria-labelledby="ex_disabled_end_sep ex_disabled_label" aria-label="End of"></div>
    </section>

  <!-- Generated by process-test-directory.js -->
  <div style="position: relative; left: 0; right: 0; height: 2rem;">
    <button class="button-run-test-setup" autofocus style="height: 100%; width: 100%;">Run Test Setup</button>
  </div>
  <!-- End of generated output --></main>
</body>
</html>
